services:
  shellcrash:
    image: juewuy/shellcrash:latest
    container_name: shellcrash
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    networks:
      proxy:
        ipv4_address: ${SHELLCRASH_IP:?set SHELLCRASH_IP in .env}
    volumes:
      - ./shellcrash:/etc/ShellCrash

  tailscale:
    image: tailscale/tailscale:${TS_IMAGE_TAG:-latest}
    container_name: shellcrash-tailscale
    restart: unless-stopped
    network_mode: service:shellcrash
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_HOSTNAME: ${TS_HOSTNAME:-shellcrash}
      TS_ROUTES: ${TS_ROUTES:-28.0.0.0/8}
      TS_EXTRA_ARGS: ${TS_ROUTER_EXTRA_ARGS:---advertise-exit-node --snat-subnet-routes=true}
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    depends_on:
      - shellcrash

  host-shim:
    image: tailscale/tailscale:${TS_IMAGE_TAG:-latest}
    container_name: ${HOST_SHIM_CONTAINER_NAME:-shellcrash-host-shim}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      PARENT_IFACE: ${PARENT_IFACE:?set PARENT_IFACE in .env}
      SHELLCRASH_IP: ${SHELLCRASH_IP:?set SHELLCRASH_IP in .env}
      HOST_SHIM_IP: ${HOST_SHIM_IP:?set HOST_SHIM_IP in .env}
      HOST_SHIM_IFACE: ${HOST_SHIM_IFACE:-shellcrash-host-shim}
    command:
      - /bin/sh
      - -ec
      - |
          while ! ip link show "$$PARENT_IFACE" >/dev/null 2>&1; do
            sleep 2
          done
          if ip link show "$$HOST_SHIM_IFACE" >/dev/null 2>&1; then
            ip link del "$$HOST_SHIM_IFACE"
          fi
          ip link add "$$HOST_SHIM_IFACE" link "$$PARENT_IFACE" type macvlan mode bridge
          ip addr replace "$$HOST_SHIM_IP/32" dev "$$HOST_SHIM_IFACE"
          ip link set "$$HOST_SHIM_IFACE" up
          ip route replace "$$SHELLCRASH_IP/32" dev "$$HOST_SHIM_IFACE" src "$$HOST_SHIM_IP"
          trap 'ip route del "$$SHELLCRASH_IP/32" dev "$$HOST_SHIM_IFACE" 2>/dev/null || true; ip link del "$$HOST_SHIM_IFACE" 2>/dev/null || true' TERM INT EXIT
          while :; do
            sleep 3600
          done

networks:
  proxy:
    driver: macvlan
    driver_opts:
      parent: ${PARENT_IFACE:?set PARENT_IFACE in .env}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:?set LAN_SUBNET in .env}
          gateway: ${GATEWAY_IP:?set GATEWAY_IP in .env}
          ip_range: ${MACVLAN_IP_RANGE:?set MACVLAN_IP_RANGE in .env}
